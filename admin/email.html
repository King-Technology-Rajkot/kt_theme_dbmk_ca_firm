<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">

  <div class="w-full max-w-md border border-gray-300 rounded-xl p-10 h-[500px]">
    
    <!-- Logo -->
    <div class="flex flex-col items-center mb-6">
      <img src="/images/ca.png"
           alt="CA India"
           class="h-16 mb-3" />
      <h1 class="text-[28px] font-semibold tracking-wide text-[#05598B]">DBMK &amp; CO.</h1>
    </div>

    <!-- Subtitle -->
    <p class="text-center text-[15px] font-semibold mb-8">
      Sign in to continue to Webmail
    </p>

    <!-- Email -->
    <div class="mb-6">
      <label class="block text-sm font-semibold mb-2">
        Email address
      </label>
      <div class="flex border rounded-md overflow-hidden">
        <input
          type="email"
          placeholder="Enter email"
          class="flex-1 px-3 py-2 focus:outline-none"
        />
        <span class="px-3 py-2 text-gray-500 ">
          @dbmk.in
        </span>
      </div>
    </div>

    <!-- Remember + Button -->
    <div class="flex items-center justify-between">
      <label class="flex items-center space-x-2 text-sm">
        <input type="checkbox" class="accent-yellow-500">
        <span class="font-semibold">Remember me</span>
      </label>

      <button class="bg-yellow-400 hover:bg-yellow-500 text-white font-semibold px-2 py-1 rounded-md">
        Next
      </button>
    </div>

  </div>

</body>
</html>
