 <div id="navbar"></div>

</section>
<div id="footer"></div>

<script>
  fetch("../footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
      initFooterSlider(); 
    });

  function initFooterSlider() {
    const slides = document.querySelectorAll('.footer-slide');
    let current = 0;
    let interval = null;
    const DELAY = 5000;

    if (!slides.length) return; 

    function showSlide(index) {
      slides.forEach(slide => slide.style.display = 'none');
      slides[index].style.display = 'block';
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    function prevSlide() {
      current = (current - 1 + slides.length) % slides.length;
      showSlide(current);
    }

    function startAuto() {
      interval = setInterval(nextSlide, DELAY);
    }

    function stopAuto() {
      clearInterval(interval);
    }


    showSlide(current);
    startAuto();

    const slider = document.getElementById('footer-slider');
    if (slider) {
      slider.addEventListener('mouseenter', stopAuto);
      slider.addEventListener('mouseleave', startAuto);
    }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
  }
</script>

//for animation in page//
<script>
document.addEventListener("DOMContentLoaded", () => {
  const animElements = document.querySelectorAll(
    "section, section .grid > div, section .industry-box, section .team-card, section .stats-animate"
  );

  animElements.forEach(el => {
    el.classList.add(
      "scale-90",
      "translate-y-10",
      "opacity-0",
      "transition-all",
      "duration-700",
      "ease-out"
    );
  });


  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry, idx) => {
        const el = entry.target;
        if (entry.isIntersecting) {
          
          setTimeout(() => {
            el.classList.remove("scale-90", "translate-y-10", "opacity-0");
            el.classList.add("scale-105", "translate-y-0", "opacity-100");

            setTimeout(() => {
              el.classList.remove("scale-105");
              el.classList.add("scale-100");
            }, 200);
          }, idx * 100);
        } else {
          
          el.classList.remove("scale-105", "scale-100", "translate-y-0", "opacity-100");
          el.classList.add("scale-90", "translate-y-10", "opacity-0");
        }
      });
    },
    { threshold: 0.25 } 
  );

  animElements.forEach(el => observer.observe(el));
});
</script>

</body>
</html>
