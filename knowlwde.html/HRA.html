<body>
         <div id="navbar"></div>
  <section class="">
  </section>

 <script>

<div class="w-full my-5 mt-[100px] bg-[#efefef] border border-gray-300 shadow-sm font-sans text-[12px] overflow-hidden">

    HRA Calculator

        </tr>

      <tbody class="divide-y divide-gray-200">

                <td class="p-1"><input type="text" value="0" class="w-full border border-gray-300 p-1 bg-white text-right outline-none focus:border-blue-500"></td>
                <td class="p-1 text-center border-l border-gray-300"><input type="checkbox" class="w-4 h-4 accent-[#1e407a] cursor-pointer"></td>
              </tr>
            `);
          });
        </script>
      </tbody>
      <tfoot>
        <tr class="bg-gray-200 font-bold border-t-2 border-gray-400">
          <td class="p-3 text-right text-xl">Total:</td>
          <td class="p-2"><input type="text" readonly value="0" class="w-full border border-gray-400 p-2 bg-gray-50 text-right font-bold outline-none"></td>
          <td class="p-2"><input type="text" readonly value="0" class="w-full border border-gray-400 p-2 bg-gray-50 text-right font-bold outline-none"></td>
          <td class="p-2"><input type="text" readonly value="0" class="w-full border border-gray-400 p-2 bg-gray-50 text-right font-bold outline-none"></td>
          <td class="p-2"><input type="text" readonly value="0" class="w-full border border-gray-400 p-2 bg-gray-50 text-right font-bold outline-none"></td>
          <td class="p-2"><input type="text" readonly value="0" class="w-full border border-gray-400 p-2 bg-gray-50 text-right font-bold outline-none"></td>
          <td class="bg-gray-200"></td>

      </tfoot>

  <div class="w-full mt-4 border-t-2 border-gray-400">
    <div class="bg-gray-100 border-b border-gray-300 flex justify-between items-center px-6 py-2">

    <div class="bg-white p-8 md:p-16 h-[400px] relative flex justify-center items-end">

        <span>100</span><span>80</span><span>60</span><span>40</span><span>20</span><span>0</span>
      </div>

      <div class="flex-1 max-w-full h-[250px] border-b-2 border-black relative flex justify-around items-end ml-12 md:ml-16">
        <div class="absolute w-full h-full flex flex-col justify-between pointer-events-none">
          <div class="border-t border-gray-200 w-full"></div>
          <div class="border-t border-gray-200 w-full"></div>
          <div class="border-t border-gray-200 w-full"></div>
          <div class="border-t border-gray-200 w-full"></div>
          <div class="border-t border-gray-200 w-full"></div>
        </div>

        <div class="w-16 h-[10%] bg-blue-200 border border-blue-400 z-10 transition-all hover:bg-blue-400"></div>
        <div class="w-16 h-[5%] bg-blue-200 border border-blue-400 z-10 transition-all hover:bg-blue-400"></div>
        <div class="w-16 h-[8%] bg-blue-200 border border-blue-400 z-10 transition-all hover:bg-blue-400"></div>
        <div class="w-16 h-[3%] bg-blue-200 border border-blue-400 z-10 transition-all hover:bg-blue-400"></div>
        <div class="w-16 h-[2%] bg-blue-200 border border-blue-400 z-10 transition-all hover:bg-blue-400"></div>

        <div class="absolute -bottom-10 w-full flex justify-around text-[11px] md:text-sm font-bold text-gray-700">
          <span class="w-24 text-center">Salary</span>
          <span class="w-24 text-center">HRA Received</span>
          <span class="w-24 text-center">Rent Paid</span>
          <span class="w-24 text-center">Exempted</span>
          <span class="w-24 text-center">Taxable</span>
        </div>
      </div>
    </div>
  </div>

  <div class="flex justify-end p-6 bg-gray-50 border-t border-gray-200">
    <button class="bg-[#f0ad4e] hover:bg-orange-500 text-white p-3 rounded-full shadow-lg transition-transform transform hover:scale-110">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
      </svg>
    </button>
  </div>
</div>

<div id="footer"></div>

<script>
  fetch("../footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
      initFooterSlider(); 
    });

  function initFooterSlider() {
    const slides = document.querySelectorAll('.footer-slide');
    let current = 0;
    let interval = null;
    const DELAY = 5000;

    if (!slides.length) return;

    function showSlide(index) {
      slides.forEach(slide => slide.style.display = 'none');
      slides[index].style.display = 'block';
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    function prevSlide() {
      current = (current - 1 + slides.length) % slides.length;
      showSlide(current);
    }

    function startAuto() {
      interval = setInterval(nextSlide, DELAY);
    }

    function stopAuto() {
      clearInterval(interval);
    }


    showSlide(current);
    startAuto();

    const slider = document.getElementById('footer-slider');
    if (slider) {
      slider.addEventListener('mouseenter', stopAuto);
      slider.addEventListener('mouseleave', startAuto);
    }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
  }
</script>

</body>
</html>
