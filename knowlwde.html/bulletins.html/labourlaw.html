<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    
<div id="navbar"></div>

<script>
fetch("../../navbar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;
  });
</script>

<!-- RBI Exact UI - Empty Result State -->
<div class="w-full bg-[#e9e9e9] py-8 mt-[100px]">
  <div class="max-w-[1250px] mx-auto bg-[#f7f7f7] shadow border border-gray-300 rounded-sm p-5">

    <!-- Tabs -->
    <div class="flex justify-center gap-5 mb-5 text-[13px]">
      <button class="px-7 py-[6px] border border-gray-400 bg-[#e5e5e5] rounded-sm">Notifications</button>
      <button class="px-7 py-[6px] border border-gray-400 bg-[#e5e5e5] rounded-sm">Circulars</button>
      <button class="px-7 py-[6px] border border-gray-400 bg-[#e5e5e5] rounded-sm">Press Release</button>
      <button class="px-7 py-[6px] border border-gray-400 bg-[#e5e5e5] rounded-sm">News Item</button>
    </div>

    <h2 class="text-center text-[30px] font-normal text-gray-800 mb-5">Notification/Circular Search</h2>

    <!-- Filters -->
    <div class="grid grid-cols-12 gap-3 items-end text-[13px] mb-3">
      <div class="col-span-2">
        <label class="block mb-1">Date From</label>
        <input value="12/11/2025" class="w-full border border-gray-400 bg-white px-2 py-[5px]" />
      </div>
      <div class="col-span-2">
        <label class="block mb-1">Date To</label>
        <input value="12/02/2026" class="w-full border border-gray-400 bg-white px-2 py-[5px]" />
      </div>
      <div class="col-span-4">
        <label class="block mb-1">Select</label>
        <select class="w-full border border-gray-400 bg-white px-2 py-[5px]"><option>Service Tax</option></select>
      </div>
      <div class="col-span-3">
        <label class="block mb-1">Search For : Service_Tax , notification</label>
        <button class="w-full border border-gray-400 bg-[#e5e5e5] py-[6px]">Search</button>
      </div>
      <div class="col-span-1">
        <button class="w-full border border-gray-400 bg-[#e5e5e5] py-[6px]">Back</button>
      </div>
    </div>

    <div class="text-right text-[13px] mb-1">
      <div>Total Search <span class="font-semibold">Found : 0</span></div>
      <div class="text-green-700 font-semibold">You are viewing page 21 of 1</div>
    </div>

    <!-- Table -->
    <div class="border border-[#4f79b7]">
      <table class="w-full text-[13px] border-collapse">
        <thead>
          <tr class="text-white" style="background:linear-gradient(#8fb0dd,#4f79b7);">
            <th class="border border-[#4f79b7] px-2 py-[6px] text-left w-[55%]">Page Name</th>
            <th class="border border-[#4f79b7] px-2 py-[6px] text-left w-[25%]">Circular/Notification Number</th>
            <th class="border border-[#4f79b7] px-2 py-[6px] text-left w-[20%]">Circular/Notification Date</th>
          </tr>
        </thead>
        <tbody class="bg-white">
          <tr>
            <td colspan="3" class="px-2 py-[6px] text-left">No records to display.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

   
<div id="footer"></div>

<script>
  fetch("../../footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
      initFooterSlider(); 
    });

  function initFooterSlider() {
    const slides = document.querySelectorAll('.footer-slide');
    let current = 0;
    let interval = null;
    const DELAY = 5000;

    if (!slides.length) return;

    function showSlide(index) {
      slides.forEach(slide => slide.style.display = 'none');
      slides[index].style.display = 'block';
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    function prevSlide() {
      current = (current - 1 + slides.length) % slides.length;
      showSlide(current);
    }

    function startAuto() {
      interval = setInterval(nextSlide, DELAY);
    }

    function stopAuto() {
      clearInterval(interval);
    }


    showSlide(current);
    startAuto();

    const slider = document.getElementById('footer-slider');
    if (slider) {
      slider.addEventListener('mouseenter', stopAuto);
      slider.addEventListener('mouseleave', startAuto);
    }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
  }
</script>
</body>
</html>
