<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
         <div id="navbar"></div>
  <section class="">
  </section>

 <script>
  fetch("../navbar.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;
    });
</script>
<div class="w-full bg-white p-2 font-sans text-[#333] mt-[100px] mb-[20px]">
  <div class="max-w-6xl mx-auto border border-gray-400 rounded-[2px] bg-[#f1f1f1] relative pt-6 pb-3 px-3 shadow-sm">
    
    <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-10">
      <span class="bg-[#1a407a] text-white px-5 py-0.5 rounded-[3px] text-[15px] font-bold uppercase whitespace-nowrap border border-[#1a407a]">
        FOR HOME BUYERS (REFUND OF AMOUNT)
      </span>
    </div>

    <div class="mt-2 space-y-1">
      
      <div class="grid grid-cols-[1fr_130px] items-center gap-2">
        <label class="text-[11px] text-gray-700 leading-tight">
          Amount Paid Towards Flat Cost (Excluding The Amount For Stamp Duty, Registration And Other Taxes)
        </label>
        <input type="text" value="0" class="border border-gray-400 bg-white w-full p-0.5 px-1.5 text-left text-[11px] font-bold rounded-[1px] shadow-inner" />
      </div>

      <div class="grid grid-cols-[1fr_130px] items-center gap-2">
        <label class="text-[11px] text-gray-700 leading-tight">Date Of Payment</label>
        <div class="flex gap-1 w-full justify-start">
          <input type="text" placeholder="dd" class="border border-gray-400 bg-white w-[30px] p-0.5 text-center text-[11px] rounded-[1px]" />
          <input type="text" placeholder="MM" class="border border-gray-400 bg-white w-[30px] p-0.5 text-center text-[11px] rounded-[1px]" />
          <input type="text" placeholder="yyyy" class="border border-gray-400 bg-white w-[54px] p-0.5 text-center text-[11px] rounded-[1px]" />
        </div>
      </div>

      <div class="grid grid-cols-[1fr_130px] items-center gap-2">
        <label class="text-[11px] text-gray-700 leading-tight">Amount Of Stamp Duty</label>
        <input type="text" value="0" class="border border-gray-400 bg-white w-full p-0.5 px-1.5 text-left text-[11px] font-bold rounded-[1px] shadow-inner" />
      </div>

      <div class="grid grid-cols-[1fr_130px] items-center gap-2">
        <label class="text-[11px] text-gray-700 leading-tight">Current Date</label>
        <div class="flex gap-1 w-full justify-start">
          <input type="text" value="12" class="border border-gray-400 bg-white w-[30px] p-0.5 text-center text-[11px] font-bold rounded-[1px]" />
          <input type="text" value="02" class="border border-gray-400 bg-white w-[30px] p-0.5 text-center text-[11px] font-bold rounded-[1px]" />
          <input type="text" value="2026" class="border border-gray-400 bg-white w-[54px] p-0.5 text-center text-[11px] font-bold rounded-[1px]" />
        </div>
      </div>

      <div class="grid grid-cols-[1fr_130px] items-center gap-2">
        <label class="text-[11px] text-gray-700 leading-tight">
          % of Interest Rate For Refund Of Paid Amount Towards Flat Cost
        </label>
        <div class="flex items-center w-full border border-gray-400 bg-white rounded-[1px]">
          <input type="text" value="0" class="w-full p-0.5 px-1.5 text-left text-[11px] font-bold outline-none" />
          <span class="text-[10px] text-gray-500 pr-1">%</span>
        </div>
      </div>

      <div class="grid grid-cols-[1fr_130px] items-center gap-2">
        <label class="text-[11px] text-gray-700 leading-tight">
          % Refund Of Stamp Duty (As Per Your State, If Applicable)
        </label>
        <div class="flex items-center w-full border border-gray-400 bg-white rounded-[1px]">
          <input type="text" value="0" class="w-full p-0.5 px-1.5 text-left text-[11px] font-bold outline-none" />
          <span class="text-[10px] text-gray-500 pr-1">%</span>
        </div>
      </div>

      <div class="grid grid-cols-[1fr_130px] items-center gap-2 pt-1">
        <label class="text-[11px] text-gray-700 font-bold uppercase">REFUND AMOUNT (IN RS.)</label>
        <input type="text" value="0" class="border border-gray-400 bg-white w-full p-0.5 px-1.5 text-left text-[11px] font-bold rounded-[1px] shadow-inner" readonly />
      </div>

      <div class="flex justify-center pt-3">
        <button class="bg-[#007bff] text-white px-6 py-1 rounded-[3px] text-[11px] font-bold shadow-sm active:bg-[#0062cc]">
          Calculate
        </button>
      </div>

    </div>
  </div>
</div>

    
<div id="footer"></div>

<script>
  fetch("../footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
      initFooterSlider(); 
    });

  function initFooterSlider() {
    const slides = document.querySelectorAll('.footer-slide');
    let current = 0;
    let interval = null;
    const DELAY = 5000;

    if (!slides.length) return;

    function showSlide(index) {
      slides.forEach(slide => slide.style.display = 'none');
      slides[index].style.display = 'block';
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    function prevSlide() {
      current = (current - 1 + slides.length) % slides.length;
      showSlide(current);
    }

    function startAuto() {
      interval = setInterval(nextSlide, DELAY);
    }

    function stopAuto() {
      clearInterval(interval);
    }


    showSlide(current);
    startAuto();

    const slider = document.getElementById('footer-slider');
    if (slider) {
      slider.addEventListener('mouseenter', stopAuto);
      slider.addEventListener('mouseleave', startAuto);
    }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
  }
</script>

</body>
</html>
