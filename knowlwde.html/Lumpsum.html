<div class="w-full bg-white p-2 font-sans text-[#333] mt-[100px] mb-[20px]">

        <h3 class="text-center text-[14px] font-semibold text-gray-600 mb-6 tracking-wide underline underline-offset-4 decoration-gray-300">Summery</h3>

          <div class="absolute inset-0 flex flex-col justify-between">
            <div class="border-t border-gray-200 w-full"></div>
            <div class="border-t border-gray-200 w-full"></div>
            <div class="border-t border-gray-200 w-full"></div>
            <div class="border-t border-gray-200 w-full"></div>
            <div class="border-t border-gray-200 w-full"></div>
            <div class="border-b-2 border-gray-400 w-full"></div>
          </div>
          <div class="absolute inset-0 flex justify-around items-end px-6">
            <div class="w-14 bg-[#1a407a] h-[2px] shadow-sm"></div>
            <div class="w-14 bg-[#1a407a] h-[2px] shadow-sm"></div>
            <div class="w-14 bg-[#1a407a] h-[2px] shadow-sm"></div>
          </div>
          <div class="absolute -bottom-14 inset-x-0 flex justify-around text-[10px] font-bold text-gray-600 text-center uppercase tracking-tighter">
            <div class="w-24">Invested Amount</div>
            <div class="w-24">Total Value</div>

          </div>

      </div>

</div>
    
<div id="footer"></div>

<script>
  fetch("../footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
      initFooterSlider(); 
    });

  function initFooterSlider() {
    const slides = document.querySelectorAll('.footer-slide');
    let current = 0;
    let interval = null;
    const DELAY = 5000;

    if (!slides.length) return;

    function showSlide(index) {
      slides.forEach(slide => slide.style.display = 'none');
      slides[index].style.display = 'block';
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    function prevSlide() {
      current = (current - 1 + slides.length) % slides.length;
      showSlide(current);
    }

    function startAuto() {
      interval = setInterval(nextSlide, DELAY);
    }

    function stopAuto() {
      clearInterval(interval);
    }


    showSlide(current);
    startAuto();

    const slider = document.getElementById('footer-slider');
    if (slider) {
      slider.addEventListener('mouseenter', stopAuto);
      slider.addEventListener('mouseleave', startAuto);
    }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
  }
</script>


</body>
</html>
